<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đặt Món - Cafe Order</title>
<style>
  :root {
    --bg: #f4efe9;
    --card: #ffffff;
    --ink: #3a2e26;
    --muted: #8a7a6d;
    --brand: #6f4e37;
    --brand-dark: #543a29;
    --accent: #c8956d;
    --line: #e7ddd2;
    --ok: #2e7d5b;
    --shadow: 0 4px 18px rgba(90, 63, 42, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand); }

  /* Header */
  header.site {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff;
    padding: 28px 20px;
    text-align: center;
  }
  header.site h1 { margin: 0; font-size: 1.9rem; letter-spacing: 0.5px; }
  header.site p { margin: 6px 0 0; opacity: 0.9; font-size: 0.95rem; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
    align-items: start;
  }

  /* Menu */
  .menu-section { min-width: 0; }
  .cat-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--brand-dark);
    margin: 22px 0 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--line);
  }
  .cat-title:first-of-type { margin-top: 0; }
  .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item .emoji { font-size: 1.8rem; }
  .item .name { font-weight: 600; }
  .item .price { color: var(--muted); font-size: 0.92rem; }
  .item .add {
    margin-top: auto;
    border: none;
    background: var(--brand);
    color: #fff;
    padding: 9px 12px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .item .add:hover { background: var(--brand-dark); }
  .item .add:active { transform: scale(0.97); }

  /* Cart */
  .cart {
    position: sticky;
    top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .cart h2 { margin: 0 0 12px; font-size: 1.2rem; color: var(--brand-dark); }
  .cart-empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 0.95rem; }
  .cart-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .cart-line .ln-name { font-weight: 600; font-size: 0.95rem; }
  .cart-line .ln-price { color: var(--muted); font-size: 0.85rem; }
  .qty {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .qty button {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    background: #faf6f1;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    color: var(--brand-dark);
  }
  .qty button:hover { background: var(--line); }
  .qty span { min-width: 20px; text-align: center; font-weight: 600; }
  .ln-total { font-weight: 700; text-align: right; grid-column: 2; }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 14px 0 6px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .total-row .sum { color: var(--brand); font-size: 1.35rem; }

  /* Customer form */
  .cust { margin-top: 12px; display: grid; gap: 10px; }
  .cust label { font-size: 0.85rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 3px; }
  .cust input, .cust textarea, .cust select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fffdfb;
    color: var(--ink);
  }
  .cust input:focus, .cust textarea:focus, .cust select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200, 149, 109, 0.18);
  }
  .cust textarea { resize: vertical; min-height: 54px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .submit {
    margin-top: 14px;
    width: 100%;
    border: none;
    background: var(--ok);
    color: #fff;
    padding: 13px;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .submit:hover { opacity: 0.92; }
  .submit:disabled { background: #b9b1a8; cursor: not-allowed; }

  /* Toast / receipt */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(40, 28, 20, 0.55);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .receipt {
    background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
    padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .receipt h3 { margin: 0 0 4px; color: var(--ok); }
  .receipt pre {
    background: #faf6f1; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word;
    max-height: 240px; overflow: auto; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .receipt .actions { display: flex; gap: 10px; margin-top: 14px; }
  .receipt .actions button {
    flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer;
  }
  .btn-copy { background: var(--brand); color: #fff; }
  .btn-close { background: var(--line); color: var(--ink); }

  footer.site { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    .cart { position: static; }
  }
</style>
</head>
<body>
  <header class="site">
    <h1>☕ Cafe Order</h1>
    <p>Chọn món yêu thích của bạn và đặt ngay!</p>
  </header>

  <div class="wrap">
    <!-- MENU -->
    <div class="menu-section" id="menu"></div>

    <!-- CART -->
    <aside class="cart">
      <h2>🛒 Đơn hàng của bạn</h2>
      <div id="cart-lines"></div>
      <div id="cart-empty" class="cart-empty">Chưa có món nào. Hãy chọn từ menu nhé!</div>

      <div class="total-row">
        <span>Tổng cộng</span>
        <span class="sum" id="grand-total">0đ</span>
      </div>

      <form class="cust" id="order-form" autocomplete="on">
        <div>
          <label for="cust-name">Họ tên *</label>
          <input type="text" id="cust-name" name="name" placeholder="Nguyễn Văn A" required />
        </div>
        <div>
          <label for="cust-phone">Số điện thoại *</label>
          <input type="tel" id="cust-phone" name="phone" placeholder="09xxxxxxxx" required
                 pattern="[0-9]{9,11}" title="Nhập 9-11 chữ số" />
        </div>
        <div class="row2">
          <div>
            <label for="order-type">Hình thức</label>
            <select id="order-type" name="type">
              <option value="Tại quán">Uống tại quán</option>
              <option value="Mang đi">Mang đi</option>
              <option value="Giao hàng">Giao hàng</option>
            </select>
          </div>
          <div>
            <label for="table-no">Bàn số / Địa chỉ</label>
            <input type="text" id="table-no" name="table" placeholder="Bàn 5" />
          </div>
        </div>
        <div>
          <label for="note">Ghi chú</label>
          <textarea id="note" name="note" placeholder="Ít đá, ít đường, thêm sữa..."></textarea>
        </div>
        <button type="submit" class="submit" id="submit-btn" disabled>Gửi đơn hàng</button>
      </form>
    </aside>
  </div>

  <footer class="site">
    <p>© <span id="year"></span> Cafe Order · Trang web tĩnh · Chạy hoàn toàn trên trình duyệt</p>
  </footer>

  <!-- Receipt overlay -->
  <div class="overlay" id="overlay">
    <div class="receipt">
      <h3>✅ Đặt hàng thành công!</h3>
      <p style="margin:4px 0 12px;color:var(--muted);font-size:0.9rem;">
        Đây là chi tiết đơn hàng của bạn. Bạn có thể sao chép và gửi cho quán.
      </p>
      <pre id="receipt-text"></pre>
      <div class="actions">
        <button class="btn-copy" id="btn-copy">📋 Sao chép</button>
        <button class="btn-close" id="btn-close">Đóng</button>
      </div>
    </div>
  </div>

<script>
  // ====== MENU DATA (sửa tên món / giá tại đây) ======
  const MENU = [
    { cat: "Cà phê", items: [
      { id: "cf1", name: "Cà phê đen", price: 25000, emoji: "☕" },
      { id: "cf2", name: "Cà phê sữa", price: 30000, emoji: "☕" },
      { id: "cf3", name: "Bạc xỉu", price: 32000, emoji: "🥛" },
      { id: "cf4", name: "Cà phê muối", price: 35000, emoji: "🧂" },
    ]},
    { cat: "Trà & Trà sữa", items: [
      { id: "tr1", name: "Trà đào cam sả", price: 40000, emoji: "🍑" },
      { id: "tr2", name: "Trà sữa trân châu", price: 45000, emoji: "🧋" },
      { id: "tr3", name: "Trà chanh", price: 25000, emoji: "🍋" },
      { id: "tr4", name: "Trà vải", price: 38000, emoji: "🍇" },
    ]},
    { cat: "Đá xay & Sinh tố", items: [
      { id: "dx1", name: "Cookies đá xay", price: 50000, emoji: "🍫" },
      { id: "dx2", name: "Matcha đá xay", price: 52000, emoji: "🍵" },
      { id: "dx3", name: "Sinh tố bơ", price: 45000, emoji: "🥑" },
    ]},
    { cat: "Bánh & Đồ ăn nhẹ", items: [
      { id: "bk1", name: "Bánh tiramisu", price: 40000, emoji: "🍰" },
      { id: "bk2", name: "Bánh croissant", price: 30000, emoji: "🥐" },
      { id: "bk3", name: "Bánh flan", price: 20000, emoji: "🍮" },
    ]},
  ];

  const fmt = (n) => n.toLocaleString("vi-VN") + "đ";
  const cart = {}; // id -> { item, qty }

  // Render menu
  const menuEl = document.getElementById("menu");
  MENU.forEach((group) => {
    const title = document.createElement("div");
    title.className = "cat-title";
    title.textContent = group.cat;
    menuEl.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "items";
    group.items.forEach((it) => {
      const card = document.createElement("div");
      card.className = "item";
      card.innerHTML = `
        <div class="emoji">${it.emoji}</div>
        <div class="name">${it.name}</div>
        <div class="price">${fmt(it.price)}</div>
        <button class="add" data-id="${it.id}">+ Thêm vào đơn</button>`;
      grid.appendChild(card);
    });
    menuEl.appendChild(grid);
  });

  const itemById = {};
  MENU.forEach(g => g.items.forEach(it => itemById[it.id] = it));

  menuEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".add");
    if (!btn) return;
    addToCart(btn.dataset.id);
  });

  function addToCart(id) {
    if (!cart[id]) cart[id] = { item: itemById[id], qty: 0 };
    cart[id].qty++;
    renderCart();
  }
  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderCart();
  }

  const linesEl = document.getElementById("cart-lines");
  const emptyEl = document.getElementById("cart-empty");
  const totalEl = document.getElementById("grand-total");
  const submitBtn = document.getElementById("submit-btn");

  function renderCart() {
    linesEl.innerHTML = "";
    const ids = Object.keys(cart);
    emptyEl.style.display = ids.length ? "none" : "block";
    submitBtn.disabled = ids.length === 0;

    let total = 0;
    ids.forEach((id) => {
      const { item, qty } = cart[id];
      const lineTotal = item.price * qty;
      total += lineTotal;

      const row = document.createElement("div");
      row.className = "cart-line";
      row.innerHTML = `
        <div>
          <div class="ln-name">${item.emoji} ${item.name}</div>
          <div class="ln-price">${fmt(item.price)}</div>
        </div>
        <div class="qty">
          <button type="button" data-id="${id}" data-d="-1">−</button>
          <span>${qty}</span>
          <button type="button" data-id="${id}" data-d="1">+</button>
        </div>
        <div class="ln-total">${fmt(lineTotal)}</div>`;
      linesEl.appendChild(row);
    });
    totalEl.textContent = fmt(total);
  }

  linesEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]");
    if (!b) return;
    changeQty(b.dataset.id, parseInt(b.dataset.d, 10));
  });

  // Submit -> build receipt
  document.getElementById("order-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("cust-name").value.trim();
    const phone = document.getElementById("cust-phone").value.trim();
    const type = document.getElementById("order-type").value;
    const table = document.getElementById("table-no").value.trim();
    const note = document.getElementById("note").value.trim();

    let total = 0;
    const lines = Object.values(cart).map(({ item, qty }) => {
      const lt = item.price * qty;
      total += lt;
      return `  • ${item.name} x${qty}  =  ${fmt(lt)}`;
    });

    const now = new Date();
    const ts = now.toLocaleString("vi-VN");

    const text =
`===== ĐƠN HÀNG CAFE =====
Thời gian: ${ts}
Khách hàng: ${name}
SĐT: ${phone}
Hình thức: ${type}${table ? " (" + table + ")" : ""}
${note ? "Ghi chú: " + note + "\n" : ""}-------------------------
${lines.join("\n")}
-------------------------
TỔNG CỘNG: ${fmt(total)}
=========================`;

    document.getElementById("receipt-text").textContent = text;
    document.getElementById("overlay").classList.add("show");
  });

  // Receipt actions
  document.getElementById("btn-close").addEventListener("click", () => {
    document.getElementById("overlay").classList.remove("show");
  });
  document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") e.currentTarget.classList.remove("show");
  });
  document.getElementById("btn-copy").addEventListener("click", async () => {
    const text = document.getElementById("receipt-text").textContent;
    try {
      await navigator.clipboard.writeText(text);
      const b = document.getElementById("btn-copy");
      b.textContent = "✅ Đã sao chép!";
      setTimeout(() => (b.textContent = "📋 Sao chép"), 1600);
    } catch {
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      document.getElementById("btn-copy").textContent = "✅ Đã sao chép!";
    }
  });

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
